<!doctype html>
<html lang="fr" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D100E" />

    <title>MAROUANE EL HAMDAOUI — Génie Informatique & Développeur Web Full Stack</title>
    <meta
      name="description"
      content="Portfolio de MAROUANE EL HAMDAOUI, Étudiant en cycle d’ingénierie en Génie Informatique et Développeur Web Full Stack (React, Laravel, Spring Boot, Node.js, SQL, HPS Monétique)."
    />
    <meta name="author" content="MAROUANE EL HAMDAOUI" />

    <!-- Google Fonts: Inter, JetBrains Mono & Caveat (Handwritten accents) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --brand-lime: #dfff5b;
        --brand-emerald: #22c55e;
        --brand-teal: #14b8a6;
        --brand-cyan: #22d3ee;
        --bg-dark: #0D100E;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .font-handwriting {
        font-family: 'Caveat', cursive;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0D100E;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #dfff5b, #10b981);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #eef3ea, #dfff5b);
      }

      /* Selection color */
      ::selection {
        background: rgba(223, 255, 91, 0.25);
        color: #dfff5b;
      }
    </style>
  </head>
  <body class="bg-[#0D100E] text-slate-100 antialiased selection:bg-[#dfff5b]/25 selection:text-[#dfff5b]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
